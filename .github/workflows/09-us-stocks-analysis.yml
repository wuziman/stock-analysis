name: 美股分析（12只科技股）

on:
  schedule:
    - cron: '0 22 * * 1-5'       # 北京时间 06:00 (UTC 22:00)，周一至周五
  workflow_dispatch:

concurrency:
  group: us-stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建必要目录
        run: mkdir -p data logs reports

      - name: 执行美股分析
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}
          STOCK_LIST: ${{ secrets.US_STOCK_LIST }}
          MARKET_REVIEW_REGION: us
          USE_PROXY: 'false'
          MAX_WORKERS: '1'
          REPORT_TYPE: simple
          LOG_LEVEL: INFO
        run: |
          echo "===== 美股分析 ====="
          echo "自选股: $STOCK_LIST"
          echo "推送渠道: Server酱3"
          python main.py

      - name: 上传分析报告
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: us-analysis-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
